name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: node scripts/verify-no-practice-route.mjs
      - run: npm run check:format
      - run: npm run build
        env:
          SITE_URL: https://bennnnnn.github.io/pyguid
